# Baseline timings of quality-ts and fallow: static, changed-only and CRAP runs.
# Ticket: "Task: baseline timings of quality-ts and fallow" (qualbar#23).
#
# quality-ts is private and this repo is public, so its logs and artifacts are
# public. Step output goes to files, not to the job log. Jobs that never touch
# quality-ts code (fallow on a public repo) upload their logs; every other job
# uploads only numbers (results.jsonl, machine.txt).
name: baseline-static

on:
  push:
    branches: [research/baseline-timings]
    paths:
      - bench/baseline/corpus.json
      - bench/baseline/measure.py
      - bench/baseline/setup-*.sh
      - bench/baseline/run-static.sh
      - .github/workflows/baseline-static.yml

permissions:
  contents: read

jobs:
  static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        repo: [quality-ts, zustand, ts-pattern, zod, date-fns]
        tool: [quality-ts, fallow]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      QUALITY_TS_TOKEN: ${{ secrets.QUALITY_TS_TOKEN }}
      RESULTS: ${{ github.workspace }}/results
    steps:
      - uses: actions/checkout@v4
      - id: corpus
        run: |
          echo "node=$(jq -r '.["${{ matrix.repo }}"].node' bench/baseline/corpus.json)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r '.["${{ matrix.repo }}"].pnpm // "11.22.0"' bench/baseline/corpus.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.corpus.outputs.node }}
      - run: npm install -g pnpm@${{ steps.corpus.outputs.pnpm }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psutil==7.0.0
      - name: Set up tool (output in a file)
        run: mkdir -p "$RESULTS/logs" && bash bench/baseline/setup-tools.sh ${{ matrix.tool }} > "$RESULTS/logs/setup-tools.log" 2>&1
      - name: Set up target (output in a file)
        run: bash bench/baseline/setup-target.sh ${{ matrix.repo }} ${{ matrix.tool }} static > "$RESULTS/logs/setup-target.log" 2>&1
      - name: Measure (output in a file)
        run: bash bench/baseline/run-static.sh ${{ matrix.repo }} ${{ matrix.tool }} "$RESULTS" > "$RESULTS/logs/run.log" 2>&1
      # The open points of quality-ts init name only files of the public target.
      - if: failure() && matrix.tool == 'quality-ts' && matrix.repo != 'quality-ts'
        run: grep -h 'pass --' "$RESULTS/logs/setup-target.log" || true
      - if: always()
        run: |
          mkdir -p "$RESULTS"
          { echo "runner_image=${ImageOS:-}-${ImageVersion:-}"; uname -a; node --version; pnpm --version; } > "$RESULTS/machine.txt"
          cat "$RESULTS/results.jsonl" 2>/dev/null | jq -c '{mode, category, run, exit_code, wall_s, peak_tree_rss_mb}' || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.os }}-${{ matrix.repo }}-${{ matrix.tool }}
          path: |
            results/results.jsonl
            results/machine.txt
          if-no-files-found: warn
      - if: always() && matrix.tool == 'fallow' && matrix.repo != 'quality-ts'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.repo }}-${{ matrix.tool }}
          path: |
            results/logs
            results/out
